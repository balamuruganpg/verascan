[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verascan"
dynamic = ["version"]
description = "Detect data contamination between training and evaluation sets — exact, fuzzy, and semantic matching."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Verascan Contributors" },
]
keywords = [
    "contamination",
    "data-quality",
    "llm",
    "machine-learning",
    "evaluation",
    "deduplication",
    "rag",
    "synthetic-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "datasketch>=1.6",
    "tqdm>=4.60",
    "typer[all]>=0.9",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.7",
]
hf = [
    "datasets>=2.0",
]
all = [
    "verascan[semantic,hf]",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.5",
    "pandas-stubs",
]

[project.scripts]
verascan = "verascan.cli:app"

[project.urls]
Homepage = "https://github.com/balamuruganpg/verascan"
Documentation = "https://github.com/balamuruganpg/verascan#readme"
Repository = "https://github.com/balamuruganpg/verascan"
Issues = "https://github.com/balamuruganpg/verascan/issues"

[tool.hatch.version]
path = "src/verascan/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/verascan"]

[tool.hatch.build.targets.wheel.force-include]
"src/verascan/report.html" = "verascan/report.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
